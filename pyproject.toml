[project]
name = "xearch-mcp"
version = "0.1.0"
description = "Xearch MCP — search and read X/Twitter posts without an API key"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Truen" }]
keywords = ["mcp", "mcp-server", "twitter", "x", "search", "osint", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp>=2.3,<3",
  "httpx2>=2.5",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
xearch-mcp = "xearch_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/overtimepog/xearch-mcp"
Repository = "https://github.com/overtimepog/xearch-mcp"
Issues = "https://github.com/overtimepog/xearch-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xearch_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: hits live X/Brave endpoints (skipped unless XEARCH_RUN_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
